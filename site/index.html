<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F6F8">
<title>企业风险监测</title>
<style>
:root{
  --sans:"Inter","Segoe UI Variable Text","Segoe UI","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --bg:#F5F6F8; --card:#FFFFFF; --line:#E3E6EB;
  --text:#16181D; --text-2:#5B6270; --text-3:#8A9099;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg); color:var(--text); font-family:var(--sans); font-size:13px;
  -webkit-font-smoothing:antialiased; display:grid; place-items:center}
.box{display:flex; flex-direction:column; align-items:center; gap:14px; padding:24px}
.mark{width:38px;height:38px;border-radius:10px;background:#16181D;display:grid;place-items:center}
.name{font-size:14px; font-weight:600; letter-spacing:-.01em}
.tip{font-size:12px; color:var(--text-3); display:flex; align-items:center; gap:7px}
.spin{width:11px;height:11px;border:1.6px solid #D5D9DF; border-top-color:#5B6270; border-radius:50%;
  animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.sw{display:flex; gap:8px; margin-top:2px}
.sw a{display:inline-flex; align-items:center; height:30px; padding:0 13px; border-radius:8px;
  border:1px solid var(--line); background:var(--card); color:var(--text-2); text-decoration:none; font-size:12px}
.sw a:hover{border-color:#CBD2DA; color:var(--text)}
.sw a.on{background:#16181D; border-color:#16181D; color:#fff}
noscript p{font-size:12px; color:var(--text-2); text-align:center; line-height:1.8}
</style>
</head>
<body>
<div class="box">
  <span class="mark">
    <svg width="18" height="18" viewBox="0 0 14 14" fill="none"><rect x="1.5" y="2" width="11" height="2.2" fill="#fff"/><rect x="1.5" y="6" width="7.5" height="2.2" fill="#fff"/><rect x="1.5" y="10" width="9.5" height="2.2" fill="#fff"/></svg>
  </span>
  <span class="name">企业风险监测</span>
  <span class="tip"><i class="spin"></i>正在打开<em id="which" style="font-style:normal"></em></span>
  <div class="sw" id="sw">
    <a id="toPc" href="pc.html">电脑版</a>
    <a id="toM" href="m.html">手机版</a>
  </div>
  <noscript><p>请手动选择：<a href="pc.html">电脑版</a> · <a href="m.html">手机版</a></p></noscript>
</div>
<script>
(function(){
  var q = location.search, h = location.hash;
  var isM;
  if(/[?&]v=m\b/.test(q)){ isM = true; }
  else if(/[?&]v=pc\b/.test(q)){ isM = false; }
  else {
    var ua = navigator.userAgent || '';
    isM = (window.matchMedia && matchMedia('(max-width:820px)').matches)
       || /Android|iPhone|iPad|iPod|Windows Phone|HarmonyOS|Mobile Safari/i.test(ua);
  }
  var target = (isM ? 'm.html' : 'pc.html') + q + h;
  document.getElementById('which').textContent = isM ? '手机版' : '电脑版';
  document.getElementById('toPc').href = 'pc.html' + q + h;
  document.getElementById('toM').href  = 'm.html'  + q + h;
  document.getElementById(isM ? 'toM' : 'toPc').className = 'on';
  try{ location.replace(target); }catch(e){ location.href = target; }
})();
</script>
</body>
</html>
