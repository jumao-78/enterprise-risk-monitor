<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>企业风险监测 · 原型汇总</title>
<style>
:root{
  --sans:"Inter","Segoe UI Variable Text","Segoe UI","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --bg:#F5F6F8; --card:#FFFFFF;
  --line:#EDEFF3; --line-2:#E3E6EB;
  --text:#16181D; --text-2:#5B6270; --text-3:#8A9099; --text-4:#AAB0B9;
  --shadow:0 1px 2px rgba(17,24,39,.04);
  --amber:#B45309;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
html{scrollbar-width:none; -ms-overflow-style:none}
::-webkit-scrollbar{width:0;height:0}
body{background:var(--bg); color:var(--text); font-family:var(--sans); font-size:13px; line-height:1.5;
  -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums; overflow:hidden}
button{font-family:inherit; color:inherit}
.app{display:flex; height:100vh; height:100dvh; overflow:hidden}

/* 侧栏 */
.side{width:228px; flex:0 0 228px; background:var(--card); border-right:1px solid var(--line);
  padding:13px 11px; display:flex; flex-direction:column; height:100vh; height:100dvh;
  overflow-y:auto; overflow-x:hidden; transition:width .18s ease, flex-basis .18s ease}
.brand{display:flex; align-items:center; gap:9px; padding:5px 8px 14px}
.brand .mark{width:26px;height:26px;border-radius:7px;background:#16181D;display:grid;place-items:center;flex:0 0 26px}
.brand .name{font-size:13.5px; font-weight:600; letter-spacing:-.01em; white-space:nowrap}
.brand .collapse{margin-left:auto; background:none;border:0;padding:0;cursor:pointer;display:flex;align-items:center;
  color:var(--text-4);transition:transform .18s,color .12s}
.brand .collapse:hover{color:var(--text-2)}
.grp{font-size:11.5px; color:var(--text-4); padding:9px 9px 5px; white-space:nowrap}
.nav{display:flex; flex-direction:column; gap:1px}
.item{display:flex; align-items:center; gap:9px; height:32px; padding:0 9px; border-radius:7px;
  color:var(--text-2); font-size:12.5px; cursor:pointer; text-decoration:none; user-select:none; white-space:nowrap}
.item svg{flex:0 0 16px; color:var(--text-3)}
.item:hover{background:#F7F8FA; color:var(--text)}
.item.on{background:#F2F3F5; color:var(--text); font-weight:500}
.item.on svg{color:var(--text)}
.item.disabled{color:var(--text-4); cursor:default}
.item.disabled:hover{background:none; color:var(--text-4)}
.item .dot{margin-left:auto; width:6px;height:6px;border-radius:50%}
.d-ok{background:#22A45D} .d-part{background:#E29A2D} .d-wait{background:#C6CAD1}
.side-foot{margin-top:auto; padding-top:8px}
.srcs{display:flex; flex-direction:column; gap:1px}
.srcrow{display:flex; align-items:center; gap:9px; height:28px; padding:0 9px; font-size:12px; color:var(--text-2); white-space:nowrap}
.srcrow .sq{width:7px;height:7px;border-radius:2px;flex:0 0 7px}
.srcrow span{margin-left:auto; font-size:11px; color:var(--text-4)}
.demo-card{border:1px solid #F3E3C8; background:#FFFCF6; border-radius:9px; padding:9px 10px; margin:12px 0 10px}
.demo-card .t{display:flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600; color:var(--amber)}
.demo-card .t i{width:6px;height:6px;border-radius:50%;background:#E29A2D}
.demo-card p{margin:4px 0 0; font-size:11px; color:var(--text-3); line-height:1.55}
.demo-card a{display:inline-block;margin-top:5px;font-size:11px;color:var(--text-2);text-decoration:none;border-bottom:1px solid var(--line-2)}
.user{display:flex; align-items:center; gap:9px; padding:9px 5px 3px; border-top:1px solid var(--line)}
.user .av{width:26px;height:26px;border-radius:50%;background:#E9EBEF;display:grid;place-items:center;font-size:11px;color:var(--text-2);flex:0 0 26px}
.user .nm{font-size:12px; font-weight:500; line-height:1.3; white-space:nowrap}
.user .em{font-size:10.5px; color:var(--text-4); line-height:1.3; white-space:nowrap}

/* 侧栏收起 */
.app.collapsed .side{width:68px;flex-basis:68px;padding:13px 11px}
.app.collapsed .brand{gap:5px;padding:5px 4px 14px}
.app.collapsed .brand .name{display:none}
.app.collapsed .brand .collapse{margin-left:auto;transform:rotate(180deg)}
.app.collapsed .grp{display:none}
.app.collapsed .item{justify-content:center;padding:0;font-size:0;position:relative}
.app.collapsed .item .dot{position:absolute;top:8px;right:11px;margin:0}
.app.collapsed .srcs{display:none}
.app.collapsed .demo-card{display:none}
.app.collapsed .user{justify-content:center;padding:9px 0 3px}
.app.collapsed .user > span:last-child{display:none}

/* 顶栏 */
.main{flex:1; min-width:0; display:flex; flex-direction:column; height:100vh; height:100dvh; overflow:hidden}
.top{height:54px; flex:0 0 54px; background:var(--card); border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:12px; padding:0 22px; z-index:10}
.crumb{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-3)}
.crumb b{color:var(--text); font-weight:500}
.top .right{margin-left:auto; display:flex; align-items:center; gap:9px}
.search{display:flex; align-items:center; gap:7px; height:32px; width:258px;
  border:1px solid var(--line-2); border-radius:8px; padding:0 10px; color:var(--text-4); background:var(--card)}
.search:focus-within{border-color:#CBD2DA}
.search input{border:0; outline:0; background:none; font:inherit; color:var(--text); width:100%}
.search input::placeholder{color:var(--text-4)}
.icon-btn{width:32px;height:32px;border:1px solid var(--line-2); border-radius:8px; background:var(--card);
  display:grid;place-items:center; color:var(--text-2); cursor:pointer; position:relative}
.icon-btn:hover{background:#F7F8FA}
.icon-btn .pip{position:absolute; top:6px; right:7px; width:5px;height:5px;border-radius:50%;background:#E29A2D;border:1.5px solid #fff}
.av-top{width:28px;height:28px;border-radius:50%;background:#E9EBEF;display:grid;place-items:center;font-size:11px;color:var(--text-2)}

/* 页面容器 */
.host{position:relative; flex:1; min-height:0; background:var(--bg)}
.frame{position:absolute; inset:0; width:100%; height:100%; border:0; display:none; background:var(--bg)}
.frame.on{display:block}

:focus-visible{outline:2px solid #16181D; outline-offset:2px; border-radius:5px}

@media (max-width:900px){
  .app{flex-direction:column}
  .side{width:100%; flex:0 0 auto; height:auto; flex-direction:row; align-items:center; gap:4px;
    padding:7px 8px; border-right:0; border-bottom:1px solid var(--line); overflow-x:auto; overflow-y:hidden}
  .side::-webkit-scrollbar{height:0}
  .brand{padding:0 4px 0 0}
  .brand .name,.brand .collapse,.grp,.side-foot{display:none!important}
  .nav{flex-direction:row; gap:2px}
  .item{height:30px; padding:0 10px}
  .item .dot{display:none}
  .app.collapsed .side{width:100%; flex-basis:auto}
  .app.collapsed .item{font-size:12.5px; padding:0 10px; justify-content:flex-start}
  .main{height:auto; flex:1; min-height:0}
  .top{height:48px; flex:0 0 48px; padding:0 14px}
  .search{display:none}
}
</style>
</head>

.top=(h>below && r.top>h+8) ? Math.max(8, r.top-h-6)+'px' : (r.bottom+6)+'px';\n}\nSel.prototype.draw=function(){\n  var self=this, q=this._q, html='';\n  if(this.cfg.search){\n    html+='<div class=\"ssearch\"><svg width=\"13\" height=\"13\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><circle cx=\"7.2\" cy=\"7.2\" r=\"4.6\"/><path d=\"m10.7 10.7 3 3\"/><\/svg>'\n        + '<input placeholder=\"'+(this.cfg.searchTip||'搜索…')+'\"><\/div>';\n  }\n  html+='<div class=\"slist\">';\n  var g=null;\n  this.items.forEach(function(x){\n    if(x.g && x.g!==g){ html+='<div class=\"sgrp\">'+x.g+'<\/div>'; g=x.g; }\n    html+='<div class=\"sitem'+(x.v===self.value?' on':'')+'\" data-v=\"'+x.v+'\" data-t=\"'+x.t+'\">'\n      + '<span>'+x.t+'<\/span>'+(x.n!==undefined?'<span class=\"n\">'+x.n+'<\/span>':'')+'<\/div>';\n  });\n  html+='<div class=\"sempty\" style=\"display:none\">没有匹配的选项<\/div><\/div>';\n  this.pop.innerHTML=html;\n  this.pop.querySelectorAll('.sitem').forEach(function(el){\n    el.addEventListener('click', function(){ self.set(el.dataset.v); selClose(); });\n  });\n  var si=this.pop.querySelector('.ssearch input');\n  if(si){\n    si.addEventListener('input', function(){\n      self._q=si.value.trim();\n      var hit=0;\n      self.pop.querySelectorAll('.sitem').forEach(function(el){\n        var ok=!self._q || el.dataset.t.indexOf(self._q)>-1;\n        el.style.display=ok?'':'none'; if(ok) hit++;\n      });\n      self.pop.querySelector('.sempty').style.display=hit?'none':'';\n    });\n    setTimeout(function(){ si.focus(); },10);\n  }\n};\n\n/* ── 历史筛选与分页 ── */\nvar hAll=Array.prototype.slice.call(document.querySelectorAll('#hBody tr[data-step]'));\nvar hCnt=document.getElementById('hCnt'), hInfo=document.getElementById('hInfo'),\n    hPager=document.getElementById('hPager'), hEmpty=document.getElementById('hEmpty');\nvar hPage=1, PER=5, hFiltered=[];\n\nfunction hCount(attr, val){\n  if(!val) return hAll.length;\n  return hAll.filter(function(tr){ return tr.dataset[attr]===val; }).length;\n}\nvar stepCtl=new Sel(document.getElementById('selStep'), {\n  items:[{v:'',t:'全部步骤',n:hAll.length},\n         {v:'cn',t:'信用中国取数',n:hCount('step','cn')},\n         {v:'qc',t:'企查查取数',n:hCount('step','qc')},\n         {v:'ai',t:'AI 分析',n:hCount('step','ai')},\n         {v:'mail',t:'邮件发送',n:hCount('step','mail')}],\n  value:'', minWidth:190, onChange:function(){ hPage=1; hRender(); }\n});\nvar statCtl=new Sel(document.getElementById('selStat'), {\n  items:[{v:'',t:'全部状态',n:hAll.length},\n         {v:'ok',t:'成功',n:hCount('status','ok')},\n         {v:'part',t:'部分完成',n:hCount('status','part')},\n         {v:'fail',t:'失败',n:hCount('status','fail')}],\n  value:'', minWidth:170, onChange:function(){ hPage=1; hRender(); }\n});\n\nfunction hRender(){\n  hFiltered = hAll.filter(function(tr){\n    return (!stepCtl.get() || tr.dataset.step===stepCtl.get()) && (!statCtl.get() || tr.dataset.status===statCtl.get());\n  });\n  var pages=Math.max(1,Math.ceil(hFiltered.length/PER));\n  if(hPage>pages) hPage=pages;\n  hAll.forEach(function(tr){ tr.style.display='none'; });\n  hFiltered.slice((hPage-1)*PER, hPage*PER).forEach(function(tr){ tr.style.display=''; });\n  hCnt.textContent='共 '+hFiltered.length+' 条';\n  var from=hFiltered.length?((hPage-1)*PER+1):0, to=Math.min(hPage*PER,hFiltered.length);\n  hInfo.textContent = hFiltered.length ? ('第 '+from+'–'+to+' 条，共 '+hFiltered.length+' 条') : '无记录';\n  hEmpty.style.display = hFiltered.length ? 'none' : '';\n  var html='<button class=\"pg\" data-p=\"prev\" '+(hPage===1?'disabled':'')+'>上一页<\/button>';\n  for(var i=1;i<=pages;i++) html+='<button class=\"pg '+(i===hPage?'on':'')+'\" data-p=\"'+i+'\">'+i+'<\/button>';\n  html+='<button class=\"pg\" data-p=\"next\" '+(hPage===pages?'disabled':'')+'>下一页<\/button>';\n  hPager.innerHTML=html;\n}\nhPager.addEventListener('click', function(e){\n  var b=e.target.closest('button[data-p]'); if(!b || b.disabled) return;\n  var pages=Math.max(1,Math.ceil(hFiltered.length/PER)), p=b.dataset.p;\n  if(p==='prev') hPage=Math.max(1,hPage-1);\n  else if(p==='next') hPage=Math.min(pages,hPage+1);\n  else hPage=+p;\n  hRender();\n});\ndocument.getElementById('hClear').addEventListener('click', function(){ stepCtl.set('',true); statCtl.set('',true); hPage=1; hRender(); });\nhRender();\n\n/* ── 演示状态切换 ── */\nfunction setDemo(st){\n  var fail = st==='fail';\n  document.getElementById('errorBar').style.display = fail ? 'flex' : 'none';\n  document.getElementById('failBox').style.display = fail ? '' : 'none';\n  var rail=document.querySelectorAll('#steps .stp');\n  rail[2].className='stp '+(fail?'fail':'wait');\n  rail[2].querySelector('.tm').textContent = fail ? '失败' : '—';\n  rail[3].className='stp wait';\n  document.getElementById('statusText').innerHTML = fail\n    ? '本次运行 <b>2/4<\/b> 步完成，<b>3<\/b> 个失败任务（AI 分析）；两源入库 <b>22<\/b> 条（去重 3 条）；企查查「经营风险」无权限 <b>2<\/b> 家。'\n    : '本次运行 <b>2/4<\/b> 步完成，<b>0<\/b> 个失败任务；两源入库 <b>22<\/b> 条（去重 3 条）；企查查「经营风险」无权限 <b>2<\/b> 家。';\n  document.querySelectorAll('[data-demo]').forEach(function(b){ b.classList.toggle('on', b.dataset.demo===st); });\n}\ndocument.querySelectorAll('[data-demo]').forEach(function(b){\n  b.addEventListener('click', function(){ setDemo(b.dataset.demo); });\n});\ndocument.querySelectorAll('.failbox .retry').forEach(function(a){\n  a.addEventListener('click', function(){ say('已重试：恒昌达建筑工程有限公司'); });\n});\ndocument.getElementById('retryAll').addEventListener('click', function(){ say('已重试 3 家，约 1 分钟'); });\ndocument.getElementById('errRetry').addEventListener('click', function(){ say('已重跑 AI 分析（演示）'); });\n\n/* ── 运行模拟 ── */\nvar stps=Array.prototype.slice.call(document.querySelectorAll('#steps .stp'));\nvar cards=document.querySelectorAll('.srccard');\nvar statusText=document.getElementById('statusText');\nvar running=false;\nvar DUR=[3000,3000,1800,1200], TOTAL=DUR.reduce(function(a,b){return a+b;},0);\n\nfunction paintRail(cur, allDone){\n  stps.forEach(function(el,i){\n    el.className='stp '+(allDone?'done':(i<cur?'done':(i===cur?'run':'wait')));\n  });\n}\nfunction nowStr(){\n  var d=new Date();\n  return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);\n}\nfunction runFlow(){\n  if(running) return; running=true;\n  document.getElementById('btnAll').disabled=true;\n  document.getElementById('btnAll').style.opacity=.5;\n  document.querySelectorAll('.actions .btn').forEach(function(b){ b.disabled=true; });\n  cards[0].classList.add('running'); cards[1].classList.remove('running');\n  cards[0].querySelector('.pill').textContent='运行中';\n  var t0=Date.now();\n  var timer=setInterval(function(){\n    var el=Date.now()-t0;\n    if(el>=TOTAL){ clearInterval(timer); finish(); return; }\n    var acc=0, cur=0;\n    for(var i=0;i<4;i++){ if(el < acc+DUR[i]){ cur=i; break; } acc+=DUR[i]; }\n    var p=(el-acc)/DUR[cur];\n    paintRail(cur,false);\n    if(cur<2){\n      cards[0].classList.toggle('running', cur===0);\n      cards[1].classList.toggle('running', cur===1);\n      cards[0].querySelector('.pill').textContent = cur===0?'运行中':'成功';\n      cards[1].querySelector('.pill').textContent = cur===1?'运行中':'部分完成';\n      var n=Math.min(25,Math.floor(p*25)+1);\n      var rest=Math.max(1,Math.ceil(DUR[cur]*(1-p)/1000));\n      cards[cur].querySelector('.tm').textContent='进行中';\n      document.getElementById('bar'+(cur+1)).style.width=(p*100).toFixed(1)+'%';\n      document.getElementById('tx'+(cur+1)).innerHTML='第 <b>'+n+'/25<\/b> 家　当前：<b>'+NAMES[(n-1)%25]+'<\/b>　剩余约 <b>'+rest+' 秒<\/b>';\n      statusText.innerHTML='正在执行 <b>'+(cur+1)+'/4<\/b>：<b>'+(cur===0?'信用中国':'企查查')+'<\/b>　第 '+n+'/25 家';\n    } else {\n      cards[0].classList.remove('running'); cards[1].classList.remove('running');\n      statusText.innerHTML='正在执行 <b>'+(cur+1)+'/4<\/b>：<b>'+(cur===2?'AI 分析':'邮件发送')+'<\/b>';\n    }\n  }, 100);\n}\nfunction finish(){\n  running=false;\n  paintRail(4,true);\n  stps.forEach(function(el,i){ el.querySelector('.tm').textContent = i<2 ? nowStr() : nowStr(); });\n  cards[0].classList.remove('running'); cards[1].classList.remove('running');\n  cards[0].querySelector('.pill').textContent='成功';\n  cards[1].querySelector('.pill').textContent='部分完成';\n  cards[0].querySelector('.tm').textContent=nowStr()+' 完成';\n  cards[1].querySelector('.tm').textContent=nowStr()+' 完成';\n  document.getElementById('btnAll').disabled=false;\n  document.getElementById('btnAll').style.opacity='';\n  document.querySelectorAll('.actions .btn').forEach(function(b){ b.disabled=false; });\n  statusText.innerHTML='本次运行 <b>4/4<\/b> 步完成，<b>0<\/b> 个失败任务；两源入库 <b>22<\/b> 条（去重 3 条）；企查查「经营风险」无权限 <b>2<\/b> 家。';\n  say('全流程已完成，邮件已发送给 3 人');\n}\nlogMask.addEventListener('click', function(e){ if(e.target===logMask) logMask.classList.remove('on'); });\ndocument.addEventListener('keydown', function(e){\n  if(e.key==='Escape'){ mask.classList.remove('on'); logMask.classList.remove('on'); listMask.classList.remove('on'); }\n});\n<\/script>\n<script>\n(function(){\n  var app=document.querySelector('.app'), btn=document.getElementById('sideToggle');\n  if(!app || !btn) return;\n  document.querySelectorAll('.side .item').forEach(function(it){\n    if(!it.title){ var t=(it.textContent||'').trim(); if(t) it.title=t; }\n  });\n  function setCol(on){\n    app.classList.toggle('collapsed', on);\n    var lbl = on ? '展开侧栏' : '收起侧栏';\n    btn.setAttribute('aria-label', lbl); btn.title = lbl;\n    try{ localStorage.setItem('sideCollapsed', on ? '1' : '0'); }catch(e){}\n  }\n  btn.addEventListener('click', function(){ setCol(!app.classList.contains('collapsed')); });\n  try{ if(localStorage.getItem('sideCollapsed')==='1') setCol(true); }catch(e){}\n})();\n<\/script>\n\n<style>\n/* 动画兜底：部分环境（省电模式 / 低帧率 / 无头渲染）不推进动画时钟，\n   2 秒后强制回到终态，保证图表与折线一定完整可见。 */\n.anim-done .bar,\n.anim-done .line,\n.anim-done .dot{animation:none!important; opacity:1!important; transform:none!important; stroke-dashoffset:0!important}\n<\/style>\n<script>\n(function(){\n  document.addEventListener('click', function(e){\n    var t = e.target, a = null;\n    while(t && t !== document){\n      if(t.getAttribute && t.getAttribute('data-nav')){ a = t; break; }\n      t = t.parentNode;\n    }\n    if(!a) return;\n    e.preventDefault();\n    try{ parent.WB_NAV(a.getAttribute('data-nav')); }catch(err){}\n  });\n  setTimeout(function(){\n    document.documentElement.className += ' anim-done';\n  }, 2000);\n})();\n<\/script>\n\n<\/body>\n<\/html>", "detail": "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>企业风险监测 · 风险明细<\/title>\n<style>\n\n:root{\n  --sans:\"Inter\",\"Segoe UI Variable Text\",\"Segoe UI\",\"Noto Sans SC\",\"Microsoft YaHei\",system-ui,sans-serif;\n  --bg:#F5F6F8; --card:#FFFFFF;\n  --line:#EDEFF3; --line-2:#E3E6EB;\n  --text:#16181D; --text-2:#5B6270; --text-3:#8A9099; --text-4:#AAB0B9;\n  --shadow:0 1px 2px rgba(17,24,39,.04);\n  --green:#17803D; --green-bg:#E9F7EF;\n  --red:#C2261B;   --red-bg:#FDECEC;\n  --amber:#B45309; --amber-bg:#FEF4E6;\n  --gray-bg:#F3F4F6;\n  --lv-h:#C0483B; --lv-m:#D2913F; --lv-l:#8CA3B8; --lv-0:#D8DEE6;\n}\n*{box-sizing:border-box}\nhtml,body{margin:0;padding:0}\nhtml{scrollbar-width:none; -ms-overflow-style:none}\n::-webkit-scrollbar{width:0;height:0}\nbody{background:var(--bg); color:var(--text); font-family:var(--sans); font-size:13px; line-height:1.5;\n  -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums}\nbutton{font-family:inherit; color:inherit}\n.app{display:flex; min-height:100vh}\n\n/* 侧栏 */\n.side{width:228px; flex:0 0 228px; background:var(--card); border-right:1px solid var(--line);\n  padding:13px 11px; display:flex; flex-direction:column; position:sticky; top:0; height:100vh}\n.brand{display:flex; align-items:center; gap:9px; padding:5px 8px 14px}\n.brand .mark{width:26px;height:26px;border-radius:7px;background:#16181D;display:grid;place-items:center}\n.brand .name{font-size:13.5px; font-weight:600; letter-spacing:-.01em}\n.grp{font-size:11.5px; color:var(--text-4); padding:9px 9px 5px}\n.nav{display:flex; flex-direction:column; gap:1px}\n.item{display:flex; align-items:center; gap:9px; height:32px; padding:0 9px; border-radius:7px;\n  color:var(--text-2); font-size:12.5px; cursor:pointer; text-decoration:none; user-select:none}\n.item svg{flex:0 0 16px; color:var(--text-3)}\n.item:hover{background:#F7F8FA; color:var(--text)}\n.item.on{background:#F2F3F5; color:var(--text); font-weight:500}\n.item.on svg{color:var(--text)}\n.item .dot{margin-left:auto; width:6px;height:6px;border-radius:50%}\n.d-ok{background:#22A45D} .d-part{background:#E29A2D} .d-wait{background:#C6CAD1}\n.side-foot{margin-top:auto; padding-top:8px}\n.srcs{display:flex; flex-direction:column; gap:1px}\n.srcrow{display:flex; align-items:center; gap:9px; height:28px; padding:0 9px; font-size:12px; color:var(--text-2)}\n.srcrow .sq{width:7px;height:7px;border-radius:2px;flex:0 0 7px}\n.srcrow span{margin-left:auto; font-size:11px; color:var(--text-4)}\n.demo-card{border:1px solid #F3E3C8; background:#FFFCF6; border-radius:9px; padding:9px 10px; margin:12px 0 10px}\n.demo-card .t{display:flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600; color:var(--amber)}\n.demo-card .t i{width:6px;height:6px;border-radius:50%;background:#E29A2D}\n.demo-card p{margin:4px 0 0; font-size:11px; color:var(--text-3); line-height:1.55}\n.demo-card a{display:inline-block;margin-top:5px;font-size:11px;color:var(--text-2);text-decoration:none;border-bottom:1px solid var(--line-2)}\n.user{display:flex; align-items:center; gap:9px; padding:9px 5px 3px; border-top:1px solid var(--line)}\n.user .av{width:26px;height:26px;border-radius:50%;background:#E9EBEF;display:grid;place-items:center;font-size:11px;color:var(--text-2)}\n.user .nm{font-size:12px; font-weight:500; line-height:1.3}\n.user .em{font-size:10.5px; color:var(--text-4); line-height:1.3}\n\n/* 顶 CO.length;i++){ if(CO[i].id===k) return CO[i]; } return null; }\nfunction srcN(co, s){ var n=0; co.recs.forEach(function(r){ if(r.src.indexOf(s)>-1) n++; }); return n; }\nfunction lastDate(co){ var d=''; co.recs.forEach(function(r){ if(r.date>d) d=r.date; }); return d; }\nfunction hasDual(co){ return co.recs.some(function(r){ return r.src.length>1; }); }\nfunction hasNew(co){ return co.recs.some(function(r){ return r.isNew; }); }\nfunction catsOf(co){\n  var seen={}, out=[];\n  co.recs.forEach(function(r){ if(!seen[r.cat]){ seen[r.cat]=1; out.push(r.cat); } });\n  return out;\n}\n\n/* ── 明细表 ─────────────────────────────── */\nvar sorted = CO.slice().sort(function(a,b){\n  if(LV[a.lv].k !== LV[b.lv].k) return LV[a.lv].k - LV[b.lv].k;\n  if(b.recs.length !== a.recs.length) return b.recs.length - a.recs.length;\n  return lastDate(b).localeCompare(lastDate(a));\n});\n\nfunction sumCell(co){\n  if(!co.recs.length){\n    return '<span class=\"mu2\">未发现风险记录<\/span>' + (co.positive ? '<span class=\"d\">' + co.positive.split('　')[0] + '<\/span>' : '');\n  }\n  var m={}, order=[], note={};\n  co.recs.forEach(function(r){\n    if(!m[r.cat]){ m[r.cat]=0; order.push(r.cat); }\n    m[r.cat]++;\n    if(r.note && !note[r.cat]) note[r.cat]=r.note;\n  });\n  order.sort(function(x,y){ return m[y]-m[x] || x.localeCompare(y); });\n  var txt = order.slice(0,2).map(function(c){\n    return c + ' ' + m[c] + ' 条' + (note[c] ? '（' + note[c] + '）' : '');\n  }).join('，');\n  if(order.length>2) txt += '，等 ' + order.length + ' 类';\n  var newC = co.recs.filter(function(r){ return r.isNew; }).length;\n  return txt + '<span class=\"d\">最近 ' + lastDate(co).slice(5)\n    + (newC ? '<span class=\"new-in\">本期新增 ' + newC + ' 条<\/span>' : '') + '<\/span>';\n}\nfunction srcCell(n){\n  return n ? '<b>' + n + '<\/b> 条' : '<span class=\"state na\"><i><\/i>未发现<\/span>';\n}\nfunction qccCell(co){\n  if(srcN(co,'企查查')>0) return srcCell(srcN(co,'企查查'));\n  if(co.noPerm) return '<span class=\"state np\"><i><\/i>无权限<\/span>';\n  return '<span class=\"state na\"><i><\/i>未发现<\/span>';\n}\n\nvar tbody = document.getElementById('rows');\nvar html = '';\nsorted.forEach(function(co){\n  var n = co.recs.length;\n  var q = [co.name];\n  co.recs.forEach(function(r){ q.push(r.cat, r.org, r.desc, r.src.join('')); });\n  html += '<tr data-ent=\"' + co.id + '\" data-lv=\"' + co.lv + '\" data-n=\"' + n + '\"'\n       +  ' data-cats=\"' + catsOf(co).join(',') + '\" data-q=\"' + q.join(' ').replace(/\"/g,'') + '\">'\n       +  '<td class=\"ent\"><span class=\"lvbar\" style=\"background:' + LV[co.lv].c + '\"><\/span>' + co.name + '<\/td>'\n       +  '<td><span class=\"pill ' + LV[co.lv].cls + '\">' + co.lv + '　' + n + ' 条<\/span><\/td>'\n       +  '<td class=\"src-cell\">' + srcCell(srcN(co,'信用中国')) + '<\/td>'\n       +  '<td>' + qccCell(co) + '<\/td>'\n       +  '<td>' + sumCell(co) + '<\/td>'\n       +  '<td style=\"text-align:right\"><a class=\"act\" href=\"javascript:void 0\">查看<\/a><\/td>'\n       +  '<\/tr>';\n});\nhtml += '<tr id=\"emptyRow\" style=\"display:none\"><td colspan=\"6\"><div class=\"empty\">'\n     +  '<p>这个筛选下没有记录。<\/p><div class=\"hint\" id=\"emptyHint\"><\/div>'\n     +  '<p style=\"margin-top:10px\"><a class=\"act\" href=\"javascript:void 0\" id=\"clearAll\">清空筛选<\/a><\/p>'\n     +  '<\/div><\/td><\/tr>';\ntbody.innerHTML = html;\n\n/* ── 视图一：企业（按等级三栏） ───────────── */\n(function(){\n  var stat = document.getElementById('entStat'),\n      grid = document.getElementById('entGrid'),\n      note = document.getElementById('entNote');\n  var withRec = CO.filter(function(c){ return c.recs.length; });\n  var totalR = withRec.reduce(function(s,c){ return s+c.recs.length; }, 0);\n  var newN = CO.reduce(function(s,c){ return s + c.recs.filter(function(r){ return r.isNew; }).length; }, 0);\n  var zeroN = CO.length - withRec.length;\n\n  stat.innerHTML = '合计 <b>' + totalR + '<\/b> 条　<b>' + withRec.length + '<\/b> 家有记录'\n    + '<span class=\"sp\">·<\/span>均值 <b>' + (totalR/withRe   });\n\n  var L=48, R=985, B=232, TOP=52, unit=(B-TOP)/4, slot=(R-L)/order.length, bw=30;\n  var s = '';\n  [0,2,4].forEach(function(v){\n    var y = B - v*unit;\n    s += '<line x1=\"' + L + '\" y1=\"' + y + '\" x2=\"' + R + '\" y2=\"' + y + '\" stroke=\"' + (v===0?'#E3E7ED':'#F1F3F6') + '\"/>'\n      +  '<text x=\"' + (L-10) + '\" y=\"' + (y+3.5) + '\" text-anchor=\"end\" class=\"vax\">' + v + '<\/text>';\n  });\n  order.forEach(function(cat, i){\n    var d = m[cat], x = L + i*slot + (slot-bw)/2, cx = x + bw/2, y = B, seg = '';\n    ['低','中','高'].forEach(function(lv){\n      var n = d.by[lv]; if(!n) return;\n      var h = n*unit; y -= h;\n      seg += '<rect class=\"vbar\" x=\"' + x + '\" y=\"' + y + '\" width=\"' + bw + '\" height=\"' + h + '\" fill=\"' + LV[lv].c + '\" rx=\"1.5\"/>';\n    });\n    s += '<g class=\"vcol\" data-cat=\"' + cat + '\" tabindex=\"0\">'\n      +  '<rect class=\"hit\" x=\"' + (L + i*slot) + '\" y=\"30\" width=\"' + slot + '\" height=\"' + (B-30) + '\" fill=\"transparent\"/>'\n      +  seg\n      +  '<text class=\"vval\" x=\"' + cx + '\" y=\"' + (y-8) + '\" text-anchor=\"middle\">' + d.t + '<\/text>'\n      +  '<text class=\"vlab\" x=\"' + cx + '\" y=\"' + (B+12) + '\" text-anchor=\"end\" transform=\"rotate(-40 ' + cx + ' ' + (B+12) + ')\">' + cat + '<\/text>'\n      +  '<\/g>';\n  });\n  chart.innerHTML = s;\n})();\n\n/* ── 视图三：等级（饼 + 明细表） ───────────── */\n(function(){\n  var lvN = {'高':0,'中':0,'低':0}, coN = {'高':0,'中':0,'低':0,'无':0}, catBy = {'高':{},'中':{},'低':{}};\n  CO.forEach(function(co){\n    coN[co.lv]++;\n    co.recs.forEach(function(r){\n      lvN[r.lv]++;\n      catBy[r.lv][r.cat] = (catBy[r.lv][r.cat]||0)+1;\n    });\n  });\n  var total = lvN['高'] + lvN['中'] + lvN['低'];\n  var cx=110, cy=110, rad=88, a=-90, paths='';\n  function pt(ang){\n    var r = ang*Math.PI/180;\n    return [(cx+rad*Math.cos(r)).toFixed(1), (cy+rad*Math.sin(r)).toFixed(1)];\n  }\n  ['高','中','低'].forEach(function(lv){\n    var sw = lvN[lv]/total*360;\n    var p1 = pt(a), p2 = pt(a+sw);\n    paths += '<path data-lv=\"' + lv + '\" d=\"M' + cx + ',' + cy + ' L' + p1[0] + ',' + p1[1]\n      + ' A' + rad + ',' + rad + ' 0 ' + (sw>180?1:0) + ' 1 ' + p2[0] + ',' + p2[1] + ' Z\" fill=\"' + LV[lv].c + '\" stroke=\"#fff\" stroke-width=\"2\"/>';\n    a += sw;\n  });\n  document.getElementById('pie').innerHTML = paths;\n\n  var rows = '';\n  ['高','中','低'].forEach(function(lv){\n    var cats = Object.keys(catBy[lv]).sort(function(x,y){ return catBy[lv][y]-catBy[lv][x] || x.localeCompare(y); });\n    var top = cats.slice(0,3).map(function(c){ return '<span class=\"cat\">' + c + '<b>' + catBy[lv][c] + '<\/b><\/span>'; }).join('');\n    if(cats.length>3) top += '<span class=\"cat more\">等 ' + cats.length + ' 类<\/span>';\n    rows += '<div class=\"l2r\" data-lv=\"' + lv + '\" tabindex=\"0\"><i style=\"background:' + LV[lv].c + '\"><\/i>'\n      + '<span class=\"lv\">' + lv + '<\/span><b>' + lvN[lv] + '<\/b><u>' + coN[lv] + ' 家<\/u>'\n      + '<em>' + Math.round(lvN[lv]/total*100) + '%<\/em>'\n      + '<span class=\"cats\">' + top + '<\/span><span class=\"go\">筛选<\/span><\/div>';\n  });\n  rows += '<div class=\"l2r\" data-lv=\"无\" tabindex=\"0\"><i style=\"background:var(--lv-0)\"><\/i>'\n    + '<span class=\"lv\">无<\/span><b>0<\/b><u>' + coN['无'] + ' 家<\/u><em>0%<\/em>'\n    + '<span class=\"cats\"><span class=\"cat\">守信红名单，未见风险记录<\/span><\/span><span class=\"go\">筛选<\/span><\/div>';\n  document.getElementById('lvRows').innerHTML = rows;\n})();\n\n/* ── 栏目下拉 ─────────────────────────────── */\n(function(){\n  var m = {}, order = [];\n  CO.forEach(function(co){\n    co.recs.forEach(function(r){\n      if(!m[r.cat]){ m[r.cat] = {t:0, by:{}}; order.push(r.cat); }\n      m[r.cat].t++; m[r.cat].by[r.lv] = (m[r.cat].by[r.lv]||0)+1;\n    });\n  });\n  var groups = [\n    ['高','高风险',['失信被执行','严重失信','破产重整','吊销注销']],\n    ['中','中风险',['经营异常','股权冻结','限制高消费','税务违法']],\n    ['低','低风险',['行政处罚','司法案件','股权出质']]\n  ];\n  var total = CO.reduce(function(s,c){ return s+c.recs.length; }, 0);\n  var html = '<div class=\"pitem all\" data-cat=\"\">全部<span class=\"n\">' + total + '<\/span><\/div>';\n  groups.forEach(function(g){\n    html += '<div class=\"pgrp\">' + g[1] + '<\/div>';\n    g[2].forEach(function(cat){\n      var d = m[cat]; if(!d) return;\n      var mix = '';\n      var levels = Object.keys(d.by);\n      if(levels.length>1){\n        var other = levels.filter(function(l){ return l!==g[0]; });\n        mix = '<span class=\"mix\">含' + other.join('/') + ' ' + other.reduce(function(s,l){ return s+d.by[l]; },0) + '<\/span>';\n      }\n      html += '<div class=\"pitem\" data-cat=\"' + cat + '\">' + cat + mix + '<span class=\"n\">' + d.t + '<\/span><\/div>';\n    });\n  });\n  html += '<div class=\"pempty\" style=\"display:none\">没有匹配的栏目<\/div>';\n  document.getElementById('catList').innerHTML = html;\n})();\n\n/* ── 分布图轮播 ───────────────────────────── */\nvar track = document.getElementById('track'),\n    vp = document.getElementById('vp'),\n    dots = Array.prototype.slice.call(document.querySelectorAll('#dots button')),\n    idx = 0, timer = null,\n    dwell = [10000, 6000, 6000];\n\nfunction paint(){\n  track.style.transform = 'translateX(' + (-idx * 33.3333) + '%)';\n  dots.forEach(function(d, k){ d.setAttribute('aria-current', k === idx ? 'true' : 'false'); });\n}\nfunction schedule(ms){\n  clearTimeout(timer);\n  timer = setTimeout(function(){ idx = (idx + 1) % 3; paint(); schedule(dwell[idx]); }, ms);\n}\nfunction goto(i, manual){\n  idx = (i + 3) % 3;\n  paint();\n  schedule(manual ? 10000 : dwell[idx]);\n}\ndots.forEach(function(d){ d.addEventListener('click', function(){ goto(+d.dataset.i, true); }); });\nvp.addEventListener('mouseenter', function(){ clearTimeout(timer); });\nvp.addEventListener('mouseleave', function(){ schedule(3000); });\n\nvar dragging = false, startX = 0, dx = 0;\nvp.addEventListener('pointerdown', function(e){\n  dragging = true; startX = e.clientX; dx = 0;\n  track.style.transition = 'none';\n  clearTimeout(timer);\n});\nvp.addEventListener('pointermove', function(e){\n  if(!dragging) return;\n  dx = e.clientX - startX;\n  track.style.transform = 'translateX(calc(' + (-idx * 33.3333) + '% + ' + dx + 'px))';\n});\nwindow.addEventListener('pointerup', function(){\n  if(!dragging) return;\n  dragging = false;\n  track.style.transition = '';\n  if (dx < -40) goto(idx + 1, true);\n  else if (dx > 40) goto(idx - 1, true);\n  else { paint(); schedule(dwell[idx]); }\n});\nschedule(dwell[0]);\n\n/* ── 筛选 ─────────────────────────────────── */\nvar q = document.getElementById('q'),\n    withZero = document.getElementById('withZero'),\n    cnt = document.getElementById('cnt'),\n    footCnt = document.getElementById('footCnt'),\n    catBtn = document.getElementById('catBtn'),\n    catPop = document.getElementById('catPop'),\n    curCat = '', curQ = '', curLv = '';\n\nfunction apply(){\n  var rows = Array.prototype.slice.call(document.querySelectorAll('#rows tr[data-cats]'));\n  var shown = 0, total = 0, zero = 0;\n  rows.forEach(function(tr){\n    var isZero = tr.dataset.lv === '无';\n    var cats = (tr.dataset.cats || '').split(',').filter(Boolean);\n    var okZero = !isZero || withZero.getAttribute('aria-pressed') === 'true';\n    var okCat = !curCat || cats.indexOf(curCat) > -1;\n    var okQ = !curQ || (tr.dataset.q || '').indexOf(curQ) > -1;\n    var okLv = !curLv || tr.dataset.lv === curLv;\n    var show = okZero && okCat && okQ && okLv;\n    tr.style.display = show ? '' : 'none';\n    if (show){\n      shown++;\n      if (isZero) zero++; else total += parseInt(tr.dataset.n, 10) || 0;\n    }\n  });\n  cnt.textContent = shown;\n  footCnt.textContent = '显示 ' + shown + ' 家　记录 ' + total + ' 条';\n  var emptyRow = document.getElementById('emptyRow');\n  if (emptyRow) emptyRow.style.display = shown ? 'none' : '';\n  var hint = document.getElementById('emptyHint');\n  if (hint) hint.textContent = '当前筛选：' + (curLv ? curLv + '风险　' : '') + (curCat || '全部 class=\"mask\" id=\"mask\">\n  <div class=\"dlg\">\n    <div class=\"dhd\" id=\"dTitle\">标题<\/div>\n    <div class=\"dbd\" id=\"dBody\">说明<\/div>\n    <div class=\"dfoot\">\n      <button class=\"btn\" id=\"dCancel\">取消<\/button>\n      <button class=\"btn primary\" id=\"dOk\">确认<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<div class=\"mask\" id=\"docMask\">\n  <div class=\"docbox\">\n    <div class=\"lhd\">\n      <span class=\"tt\">AI 风险分析<\/span>\n      <span class=\"chip\" id=\"docDate\">2026-10-21<\/span>\n      <button class=\"m-close\" id=\"docClose\" aria-label=\"关闭\">\n        <svg width=\"13\" height=\"13\" viewBox=\"0 0 14 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><path d=\"M3 3l8 8M11 3l-8 8\"/><\/svg>\n      <\/button>\n    <\/div>\n    <div class=\"docbody\" id=\"docBody\"><\/div>\n    <div class=\"docfoot\">\n      <span class=\"pth\" id=\"docPath\">data/ai_analysis/2026/10/2026-10-20_风险分析.md<\/span>\n      <span class=\"r\">\n        <button class=\"btn\" id=\"docCopy\">复制路径<\/button>\n        <button class=\"btn primary\" id=\"docDone\">关闭<\/button>\n      <\/span>\n    <\/div>\n  <\/div>\n<\/div>\n\n<div class=\"mask\" id=\"mailMask\">\n  <div class=\"mailbox\">\n    <div class=\"lhd\">\n      <span class=\"tt\">邮件预览<\/span>\n      <span class=\"chip\" id=\"mailDate\">2026-10-21<\/span>\n      <button class=\"m-close\" id=\"mailClose\" aria-label=\"关闭\">\n        <svg width=\"13\" height=\"13\" viewBox=\"0 0 14 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><path d=\"M3 3l8 8M11 3l-8 8\"/><\/svg>\n      <\/button>\n    <\/div>\n    <div class=\"mfields\" id=\"mailFields\"><\/div>\n    <div class=\"mailbody\"><div class=\"paper\" id=\"mailPaper\"><\/div><\/div>\n    <div class=\"mailfoot\">\n      <span class=\"r\">\n        <button class=\"btn\" id=\"mailCopy\">复制正文<\/button>\n        <button class=\"btn primary\" id=\"mailDone\">关闭<\/button>\n      <\/span>\n    <\/div>\n  <\/div>\n<\/div>\n\n<div class=\"mask\" id=\"attMask\">\n  <div class=\"attbox\">\n    <div class=\"lhd\"><span id=\"attTitle\">风险明细_2026-10-21.xlsx<\/span>\n      <button class=\"m-close\" id=\"attClose\" aria-label=\"关闭\">\n        <svg width=\"13\" height=\"13\" viewBox=\"0 0 14 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><path d=\"M3 3l8 8M11 3l-8 8\"/><\/svg>\n      <\/button>\n    <\/div>\n    <div class=\"attmeta\" id=\"attMeta\"><\/div>\n    <div class=\"attbody\" id=\"attBody\"><\/div>\n    <div class=\"attfoot\">\n      <span class=\"r\">\n        <button class=\"btn\" id=\"attDl\">下载<\/button>\n        <button class=\"btn primary\" id=\"attDone\">关闭<\/button>\n      <\/span>\n    <\/div>\n  <\/div>\n<\/div>\n\n<div class=\"toast\" id=\"toast\"><\/div>\n\n\n<script>\nvar mask=document.getElementById('mask'), dTitle=document.getElementById('dTitle'), dBody=document.getElementById('dBody'),\n    dOk=document.getElementById('dOk'), dCancel=document.getElementById('dCancel'), toast=document.getElementById('toast');\nfunction say(m){ toast.textContent=m; toast.classList.add('on'); clearTimeout(say.t); say.t=setTimeout(function(){ toast.classList.remove('on'); },1800); }\nfunction confirmDlg(t,h,ok,fn){ dTitle.textContent=t; dBody.innerHTML=h; dOk.textContent=ok||'确认';\n  mask.classList.add('on'); dOk.onclick=function(){ mask.classList.remove('on'); fn&&fn(); }; }\ndCancel.addEventListener('click', function(){ mask.classList.remove('on'); });\nmask.addEventListener('click', function(e){ if(e.target===mask) mask.classList.remove('on'); });\n\n/* ── 数据（与总览/明细同一基线：25 家 / 22 条 / 应分析 20 家） ── */\nvar DAY='2026-10-21';\nvar CO=[\n ['恒昌达建筑工程有限公司','高',2,'失信被执行人 1 条（双源印证）、严重失信 1 条，执行标的 120 万元未履行'],\n ['广泰建材有限公司','高',1,'严重失信 1 条（列入严重违法失信名单）；企查查「经营风险」无权限'],\n ['远达物流有限公司','高',1,'失信被执行人 1 条，执行标的 86 万元未履行'],\n ['瑞丰源商贸有限公司','高',1,'失信被执行人 1 条（双源印证），执行标的 214 万元未履行'],\n ['金盛通物流有限公司','高',1,'失信被执行人 1 条，执行标的 63 万元未履行'],\n ['华宇新材料科技有限公司','高',1,'严重失信 1 条（安全生产领域）'],\n ['中科精密机械制造有限公司','高',1,'破产重整 1 条，法院已裁定受理'],\n ['广联电子科技有限公司','高',1,'吊销注销 1 条，营业执照被吊销未办理注销'],\n ['天成机械制造有限公司','中',2,'经营异常 1 条（未按期公示年报）、税务违法 1 条（欠税 18.6 万元）'],\n ['天润食品加工有限公司','中',1,'经营异常 1 条（登记住所无法联系）'],\n ['康泰医药批发有限公司','中',1,'股权冻结 1 条，冻结 320 万股'],\n ['鑫达纺织服饰有限公司','中',1,'限制高消费 1 条（对法定代表人）'],\n ['新原汽贸有限公司','中',1,'行政处罚 1 条（较大金额，罚款 12.5 万元）；企查查无权限'],\n ['华远置业有限公司','低',1,'行政处罚 1 条（施工扬尘，罚款 2 万元）'],\n ['汇通商贸有限公司','低',1,'行政处罚 1 条（未明码标价，罚款 3000 元）'],\n ['宏基建材有限公司','低',1,'行政处罚 1 条（产品标识不符，罚款 8000 元）'],\n ['明远信息技术有限公司','低',1,'司法案件 1 条（技术服务合同纠纷，已结案）'],\n ['正和环保工程有限公司','低',1,'司法案件 1 条（施工合同纠纷，已调解结案）'],\n ['祥和物业管理有限公司','低',1,'股权出质 1 条（120 万股）'],\n ['兴业汽车配件有限公司','低',1,'股权出质 1 条（260 万股，双源印证）']\n];\nvar NEW3=[\n ['天成机械制造有限公司','税务违法','09-11','欠税公告 18.6 万元'],\n ['新原汽贸有限公司','行政处罚','09-27','较大金额，罚款 12.5 万元'],\n ['兴业汽车配件有限公司','股权出质','09-14','出质 260 万股（双源印证）']\n];\nvar NAMES=CO.map(function(c){ return c[0]; });\nfunction lvList(lv){ return CO.filter(function(c){ return c[1]===lv; }); }\nfunction lvCnt(lv){ return lvList(lv).reduce(function(a,c){ return a+c[2]; },0); }\nvar HI=lvList('高'), MID=lvList('中'), LOW=lvList('低');\nvar REC=CO.reduce(function(a,c){ return a+c[2]; },0);\n\n/* ── 生成分析 ── */\nvar running=false, done=false;\nfunction runAnalysis(cb){\n  if(running) return;\n  if(done){ cb&&cb(); return; }\n  running=true;\n  var b=document.getElementById('btnRun'); b.disabled=true; b.textContent='分析中…';\n  document.getElementById('bar').style.width='0%';\n  var t0=Date.now(), DUR=6000, N=CO.length;\n  var timer=setInterval(function(){\n    var p=(Date.now()-t0)/DUR; if(p>1) p=1;\n    var i=Math.min(N,Math.floor(p*N));\n    document.getElementById('bar').style.width=(p*100).toFixed(1)+'%';\n    document.getElementById('kDone').innerHTML=i+'<em>家<\/em>';\n    document.getElementById('runTx').innerHTML='已完成 <b>'+i+'/'+N+'<\/b> 家'+(i<N?'　·　当前：<b>'+NAMES[i]+'<\/b>':'　·　正在汇总');\n    if(p>=1){ clearInterval(timer); finishAnalysis(); cb&&cb(); }\n  },120);\n}\nfunction finishAnalysis(){\n  running=false; done=true;\n  var N=CO.length;\n  document.getElementById('kDone').innerHTML=N+'<em>家<\/em>';\n  document.getElementById('runTx').innerHTML='分析已完成　·　'+N+' 家企业　·　耗时 <b>5 分 48 秒<\/b>　·　模型 deepseek-flash';\n  document.getElementById('bar').style.width='100%';\n  var b=document.getElementById('btnRun'); b.disabled=false; b.textContent='重新生成';\n  var h=document.getElementById('hint'); h.className='hintbar ok';\n  document.getElementById('hintText').textContent='分析已完成 '+N+' 家，可以发送邮件了。';\n  document.getElementById('hintLink').textContent='预览邮件';\n  var sub=document.getElementById('phSub');\n  if(sub) sub.textContent='今日 25 家已取数，'+N+' 家已完成分析；上一次分析在 10-20 06:12，邮件已发 3 人。';\n  addArcRow(DAY,'09:12');\n  say('分析完成，已生成 '+N+' 份企业摘要');\n}\n\n/* ── 归档行 ── */\nvar arcTotal=24;\nfunction updateArcHint(){\n  var n=document.querySelectorAll('#arcBody tr').length;\n  var h=document.getElementById('arcHint');\n  if(h) h.textContent='共 '+arcTotal+' 份　显示最近 '+n+' 份';\n}\nfunction aiPath(d){ var a=d.split('-'); return 'data/ai_analysis/'+a[0]+'/'+a[1]+'/'+d+'_风险分析.md'; }\nfunction arcRow(d, hm, canDel, why){\n  var pre=aiPath(d);\n  return '<td>'+d+' '+hm+'<\/td><td>'+d+'<\/td><td class=\"mu\">deepseek-flash<\/td>'+\n    '<td><span class=\"path\" data-path=\"'+pre+'\">'+pre+'<\/span><\/td>'+\n    '<td style=\"text-align:right\"><a class=\"act\" data-prev=\"'+d+'\">查看<\/a>'+\n    '<a class=\"act\" data-copy=\"'+pre+'\">复制路径<\/a>'+\n    (canDel ? '<a class=\"act del\" data-del=\"'+d+'\">删除<\/a>'\n            : '<span class=\"act off\" title=\"'+why+'\">删除<\/span>')+'<\/td>';\n}\nfunction addArcRow(d, hm){\n  var body=document.getElementById('arcBody');\n  var ex=body.querySelector('[data-prev=\"'+d+'\"]');\n  if(ex){ ex.closest('tr').children[0].textContent=d+' '+hm; return; }\n  var tr=document.createElement('tr');\n  tr.innerHTML=arcRow(d, hm, false, '仅可删除 30 天前的归档（本份 0 天前）');\n  body.insertBefore(tr, body.firstChild);\n  bindRow(tr);\n  arcTotal++;\n  updateArcHint();\n}\nfunction bindRow(tr){\n  tr.querySelectorAll('[data-copy]').forEach(function(a){\n    a.addEventListener('click', function(){ a.textContent='已复制'; setTimeout(function(){ a.textContent='复制路径'; },1500); say('路径已复制'); });\n  });\n  tr.querySelectorAll('[data-prev]').forEach(function(a){\n    a.addEventListener('click', function(){ openDoc(a.dataset.prev); });\n  });\n  tr.querySelectorAll('.act.del').forEach(function(a){\n    a.addEventListener('click', function(){\n      var d=a.dataset.del;\n      confirmDlg('删除归档',\n        '将删除 <b>'+aiPath(d).replace('_风险分析.md','')+'<\/b> 下的 MD 与 DOCX（20 家企业分节），<b>不可恢复<\/b>。<br>'+\n        '删除会记入删除日志（操作人、时间、路径），仅 30 天前的归档允许删除。',\n        '删除', function(){\n          var r=a.closest('tr'); r.parentNode.removeChild(r); arcTotal--; updateArcHint(); say('已删除，删除记录已写入日志');\n        });\n    });\n  });\n  tr.querySelectorAll('.act.off').forEach(function(el){\n    el.addEventListener('click', function(){ say('仅可删除 30 天前的归档'); });\n  });\n}\ndocument.querySelectorAll('#arcBody tr').forEach(bindRow);\n\n/* ── 发送邮件（未分析时自动先分析，FR-24） ── */\nfunction doSend(){\n  var subj=mailSubj(DAY, HI.length, NEW3.length);\n  confirmDlg('发送邮件',\n    '收件人 <b>3 位<\/b>；主题 <b>'+subj+'<\/b><br>附件 2 个：风险分析报告_'+DAY+'.docx、风险明细_'+DAY+'.xlsx。<br>当前为演示数据，确认继续？',\n    '发送', function(){\n      var b=document.getElementById('btnSend'); b.disabled=true; b.textContent='发送中…';\n      setTimeout(function(){\n        b.textContent='已发送'; b.disabled=false;\n        var tr=document.createElement('tr');\n        tr.innerHTML='<td>'+DAY+' 09:14<\/td><td>'+DAY+'<\/td><td><span class=\"pill p-green\">成功<\/span><\/td>'+\n          '<td>3 人<\/td><td><a class=\"subj\" data-mail=\"'+DAY+'\">'+subj+'<\/a><\/td>'+\n          '<td><span class=\"atts\"><i data-att=\"xlsx\">风险明细_'+DAY+'.xlsx<\/i><i data-att=\"docx\">风险分析报告_'+DAY+'.docx<\/i><\/span><\/td>';\n        var body=document.getElementById('mailBody'); body.insertBefore(tr, body.firstChild);\n        tr.querySelectorAll('[data-mail]').forEach(function(a){ a.addEventListen r-events:none; transition:opacity .18s, transform .18s; z-index:80}\n.toast.on{opacity:1; transform:translateX(-50%) translateY(0)}\n\n:focus-visible{outline:2px solid #16181D; outline-offset:2px; border-radius:5px}\n.app.collapsed .side{width:68px;flex-basis:68px}\n.app.collapsed .brand{gap:5px;padding:5px 4px 14px}\n.app.collapsed .brand .name{display:none}\n.app.collapsed .brand .collapse{margin-left:auto;transform:rotate(180deg)}\n.app.collapsed .grp{display:none}\n.app.collapsed .item{justify-content:center;padding:0;font-size:0;position:relative}\n.app.collapsed .item .dot{position:absolute;top:8px;right:11px;margin:0}\n.app.collapsed .srcs,.app.collapsed .demo-card{display:none}\n.app.collapsed .user{justify-content:center;padding:9px 0 3px}\n.app.collapsed .user > span:last-child{display:none}\n.app.collapsed .brand .mark{flex:0 0 26px}\n@media (max-width:1000px){.side{display:none}.search{display:none}}\n@media print{.side,.top,.sec-foot{display:none}body{background:#fff}}\n\n<\/style>\n<\/head>\n<body>\n<main class=\"wrap\">\n\n      <div class=\"ph\">\n        <div>\n          <div class=\"ph-title\">\n            <h1>系统设置<\/h1>\n            <span class=\"demo-tag\"><i><\/i>演示快照<\/span>\n          <\/div>\n          <p class=\"sub\">定时任务每天 05:30 自动跑；自检 6 项有 1 项待处理，数据目录有 3 个临时文件可清理。<\/p>\n        <\/div>\n      <\/div>\n\n      <!-- ① 定时任务 -->\n      <section class=\"card\">\n        <div class=\"card-h\">\n          <h2>定时任务<\/h2>\n          <span class=\"dotst\" id=\"cronBadge\" style=\"display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-3)\">\n            <i style=\"width:6px;height:6px;border-radius:50%;background:#22A45D\"><\/i>已启用\n          <\/span>\n        <\/div>\n        <div class=\"fields\">\n          <div class=\"frow pair\">\n            <span class=\"k\">执行开关<\/span>\n            <span class=\"v\">\n              <button class=\"toggle\" id=\"cronToggle\" aria-pressed=\"true\"><span class=\"sw\"><\/span><span c >文件存储维护<\/h2><\/div>\n          <div class=\"fields\" style=\"padding:8px 18px 6px\">\n            <div class=\"mrow\">\n              <span class=\"nm\">诊断包<\/span>\n              <span class=\"ds\">配置（脱敏）+ 日志 + 快照结构<br><b>最近 2026-10-20 22:10 · 2.4 MB<\/b><\/span>\n              <button class=\"btn sm\" data-exp=\"diag\">导出<\/button>\n            <\/div>\n            <div class=\"mrow\">\n              <span class=\"nm\">当日资料包<\/span>\n              <span class=\"ds\">明细 xlsx + 分析 md/docx + 发信记录<br><b>最近 2026-10-21 05:41 · 1.1 MB<\/b><\/span>\n              <button class=\"btn sm\" data-exp=\"day\">导出<\/button>\n            <\/div>\n            <div class=\"mrow\">\n              <span class=\"nm\">数据目录<\/span>\n              <span class=\"ds\">打开 data 目录（D:\\risk_monitor\\data）<br><b>5.2 MB · 1,847 个文件<\/b><\/span>\n              <button class=\"btn sm\" data-exp=\"open\">打开<\/button>\n            <\/div>\n          <\/div>\n          <div class=\"sec-foot\" style=\"margin-top:auto\">\n            <span class=\"hintx\">诊断包用于排障，可直接发给技术支持；配置中的密钥已脱敏。<\/span>\n          <\/div>\n        <\/section>\n\n        <section class=\"card\">\n          <div class=\"card-h\"><h2>保留策略与清理<\/h2><\/div>\n          <div class=\"fields\" style=\"padding:8px 18px 6px\">\n            <div class=\"frow\" style=\"grid-template-columns:104px 1fr; min-height:40px\">\n              <span class=\"k\">备份文件<\/span><span class=\"v\"><span class=\"vtext\">保留 30 天，最多 20 个<\/span><\/span>\n            <\/div>\n            <div class=\"frow\" style=\"grid-template-columns:104px 1fr; min-height:40px\">\n              <span class=\"k\">诊断包<\/span><span class=\"v\"><span class=\"vtext\">保留 30 天，最多 20 个<\/span><\/span>\n            <\/div>\n            <div class=\"frow\" style=\"grid-template-columns:104px 1fr; min-height:40px\">\n              <span class=\"k\">日期资料包<\/span><span class=\"v\"><span class=\"vtext\">保留 90 天，最多 100 个<\/span><\/span>\n            <\/div>\n            <div class=\"frow\" style=\"grid-template-columns:104px 1fr; min-height:40px; border-bottom:0\">\n              <span class=\"k\">可清理<\/span>\n              <span class=\"v\"><span class=\"vtext\" id=\"cleanSum\">3 个目录 · 28 个文件 · 12.4 MB<\/span><\/span>\n            <\/div>\n          <\/div>\n          <div class=\"sec-foot\" style=\"margin-top:auto\">\n            <span class=\"hintx\">清理前会列出全部文件名<\/span>\n            <span class=\"r\"><button class=\"btn sm\" id=\"btnScan\">扫描预览<\/button><\/span>\n          <\/div>\n        <\/section>\n\n      <\/div>\n\n      <!-- ⑤ 数据目录总览 -->\n      <section class=\"card\">\n        <div class=\"card-h\">\n          <h2>数据目录总览<\/h2>\n          <a class=\"more\" href=\"javascript:void 0\" id=\"dirMore\" aria-expanded=\"false\">\n            展开\n            <svg width=\"12\" height=\"12\" viewBox=\"0 0 12 12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\"><path d=\"m3 4.6 3 3 3-3\"/><\/svg>\n          <\/a>\n        <\/div>\n        <div class=\"foldbar alarm\" id=\"foldBar\">\n          <span class=\"k\">data 5.2 MB<\/span><span class=\"sep\">·<\/span>\n          <span class=\"k\">1,847 个文件<\/span><span class=\"sep\">·<\/span>\n          <span class=\"bad\" id=\"foldBad\">3 个临时文件待清理<\/span>\n        <\/div>\n        <div class=\"dirwrap\" id=\"dirWrap\">\n          <table class=\"dtbl\">\n            <thead>\n              <tr>\n                <th style=\"width:34%\">目录 / 文件<\/th>\n                <th class=\"n\" style=\"width:12%\">文件数<\/th>\n                <th class=\"n\" style=\"width:12%\">大小<\/th>\n                <th style=\"width:26%\">最近修改<\/th>\n                <th style=\"width:16%\">状态<\/th>\n              <\/tr>\n            <\/thead>\n            <tbody id=\"dirBody\"><\/tbody>\n          <\/table>\n        <\/div>\n      <\/section>\n\n    <\/main>\n\n\n<div class=\"toast\" id=\"toast\"><\/div>\n\n<!-- 二次确认 -->\n<div class=\"mask\" id=\"mConfirm\">\n  <div class=\"dlg\">\n    <div class=\"dhd\" id=\"cfTitle\">标题<\/div>\n    <div class=\"dbd\" id=\"cfBody\"><\/div>\n    <div class=\"dfoot\">\n      <span class=\"l\" id=\"cfNote\"><\/span>\n      <button class=\"btn sm\" id=\"cfCancel\">取消<\/button>\n      <button class=\"btn sm danger\" id=\"cfOk\">确认<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<!-- 清理预览 -->\n<div class=\"mask\" id=\"mClean\">\n  <div class=\"dlg wide\">\n    <div class=\"dhd\">\n      清理预览\n      <button class=\"x\" id=\"cleanClose\" aria-label=\"关闭\">\n        <svg width=\"12\" height=\"12\" viewBox=\"0 0 14 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><path d=\"M3 3l8 8M11 3l-8 8\"/><\/svg>\n      <\/button>\n    <\/div>\n    <div class=\"dbd\" style=\"padding:12px 18px\">\n      <p>以下 5 个文件已超出保留策略（30 天 / 90 天），清理后将释放 <b>12.4 MB<\/b>。<span style=\"color:var(--text-4)\">逐项列出文件名，便于核对。<\/span><\/p>\n    <\/div>\n    <div class=\"cbox\">\n      <table class=\"ctbl\">\n        <thead>\n          <tr>\n            <th style=\"width:44px\"><input type=\"checkbox\" id=\"ckAll\" checked aria-label=\"全选\"><\/th>\n            <th>文件名<\/th><th style=\"width:108px\">所在目录<\/th><th class=\"n\" style=\"width:76px\">大小<\/th><th style=\"width:134px\">修改时间<\/th>\n          <\/tr>\n        <\/thead>\n        <tbody id=\"cleanBody\"><\/tbody>\n      <\/table>\n    <\/div>\n    <div class=\"dfoot\">\n      <span class=\"l\" id=\"cleanSumFoot\">已选 5 个 · 12.4 MB · 清理后记入日志<\/span>\n      <button class=\"btn sm\" id=\"cleanCancel\">取消<\/button>\n      <button class=\"btn sm danger\" id=\"cleanGo\">清理所选<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n\n<script>\nvar toast=document.getElementById('toast');\nfunction say(m){ toast.textContent=m; toast.classList.add('on'); clearTimeout(say.t); say.t=setTimeout(function(){ toast.classList.remove('on'); },2400); }\n\n/* ── ① 定时任务 ── */\nvar cronOn=true, cronDirty=false;\nvar cronToggle=document.getElementById('cronToggle'),\n    cronLb=document.getElementById('cronLb'),\n    cronTime=document.getElementById('cronTime'),\n    nextRunEl=document.getElementById('nextRun'),\n    cronHint=document.getElementById('cronHint'),\n    cronBadge=document.getElementById('cronBadge'),\n    dirtyCron=document.getElementById('dirtyCron'),\n    saveCron=document.getElementById('saveCron');\n\n/* 以演示当天 2026-10-22 00:15 为“现在”，计算下一次执行 */\nvar NOW=new Date(2026,9,22,0,15,0);\nfunction calcNext(){\n  var t=(cronTime.value||'05:30').split(':');\n  var d=new Date(2026,9,22,+t[0],+t[1],0);\n  if(d<=NOW) d.setDate(d.getDate()+1);\n  function p(n){ return (n<10?'0':'')+n; }\n  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());\n}\nfunction renderCron(){\n  cronLb.textContent=cronOn?'已启用':'已停用';\n  cronToggle.setAttribute('aria-pressed', cronOn?'true':'false');\n  nextRunEl.textContent = cronOn? calcNext() : '—';\n  nextRunEl.style.color = cronOn? '' : 'var(--text-4)';\n  cronBadge.innerHTML = cronOn\n    ? '<i style=\"width:6px;height:6px;border-radius:50%;background:#22A45D\"><\/i>已启用'\n    : '<i style=\"width:6px;height:6px;border-radius:50%;background:#C6CAD1\"><\/i>已停用';\n  cronBadge.style.color = cronOn? 'var(--text-3)' : 'var(--text-4)';\n  cronHint.textContent = cronOn\n    ? '到点自动执行：取数 → 分析 → 发信，全程约 6 分钟。'\n    : '已关闭自动执行；每天需在「取数·任务」手动运行，否则不会产出数据与邮件。';\n}\ncronToggle.addEventListener('click', function(){\n  cronOn=!cronOn; renderCron(); markCron();\n});\ncronTime.addEventListener('input', function(){ renderCron(); markCron(); });\nfunction markCron(){ cronDirty=true; dirtyCron.classList.add('on'); saveCron.disabled=false; }\nsaveCron.addEventListener('click', function(){\n  cronDirty=false; dirtyCron.classList.remove('on'); saveCron.disabled=true;\n  say('定时任务已保存　·　'+(cronOn?('每天 '+cronTime.value):'已关闭'));\n});\nrenderCron();\n\n/* ── ② 系统自检 ── */\nvar CHECKS=[\n  {k:'配置完整性', rs:'4 个区块齐全：数据来源 / AI / 邮件 / 企业名单', st:'ok', tx:'通过'},\n  {k:'AI 连通性', rs:'200 · 1.2s · deepseek-flash', st:'ok', tx:'通过'},\n  {k:'邮件连通性', rs:'250 · smtp.qq.com:465', st:'ok', tx:'通过'},\n  {k:'浏览器', rs:'Chromium 129.0 已安装，可启动', st:'ok', tx:'通过'},\n  {k:'登录态', rs:'<span class=\"why\">企查查登录已失效，2 家企业无法取数<\/span>', st:'bad', tx:'重新登录'},\n  {k:'OCR 模型', rs:'onnxruntime 1.18 · 模型已加载', st:'ok', tx:'通过'}\n];\nvar chkList=document.getElementById('chkList'),\n    chkSum=document.getElementById('chkSum'),\n    chkStamp=document.getElementById('chkStamp'),\n    checkTx=document.getElementById('checkTx');\n\nfunction renderChecks(items, runningIdx){\n  chkList.innerHTML=items.map(function(c,i){\n    var running = runningIdx===i,\n        pending = runningIdx!==undefined && i>runningIdx,\n        sh = running||pending ? 'wait' : (c.st==='bad'?'bad':''),\n        st = running ? '<span style=\"color:var(--text-4)\">检查中…<\/span>'\n           : pending ? '<span style=\"color:var(--text-4)\">待检测<\/span>'\n           : (c.st==='bad' ? '<a data-fix=\"'+c.k+'\">'+c.tx+'<\/a>' : c.tx),\n        rs = running ? '<span style=\"color:var(--text-4)\">正在检测…<\/span>'\n           : pending ? '<span style=\"color:var(--text-4)\">—<\/span>' : c.rs;\n    return '<div class=\"chkrow'+(c.st==='bad'&&runningIdx===undefined?' badrow':'')+'\">'\n      + '<span class=\"sh '+sh+'\"><\/span>'\n      + '<span class=\"nm\">'+c.k+'<\/span>'\n      + '<span class=\"rs\">'+rs+'<\/span>'\n      + '<span class=\"st\">'+st+'<\/span><\/div>';\n  }).join('');\n  var bad=items.filter(function(c){ return c.st==='bad'; }).length;\n  chkSum.innerHTML = runningIdx!==undefined\n    ? '正在自检…'\n    : '6 项　<b>'+(items.length-bad)+'<\/b> 通过　'+(bad?'<b class=\"bad\">'+bad+'<\/b> 待处理':'<b>0<\/b> 待处理')+'　·　耗时 <b>2.4 秒<\/b>';\n}\nrenderChecks(CHECKS);\n\ndocument.getElementById('btnCheck').addEventListener('click', function(){\n  var i=0, btn=this;\n  btn.disabled=true; btn.textContent='自检中…';\n  checkTx.textContent='正在依次检测 6 项…';\n  var timer=setInterval(function(){\n    if(i<CHECKS.length){ renderChecks(CHECKS,i); i++; return; }\n    clearInterval(timer);\n    renderChecks(CHECKS);\n    chkStamp.textContent='上次自检 2026-10-22 00:15';\n    btn.disabled=false; btn.textContent='重新自检';\n    checkTx.textContent='自检只读，不改动任何数据';\n    say('自检完成：5 项通过，1 项待处理（登录态）');\n  },260);\n});\nchkList.addEventListener('click', function(e){\n  var a=e.target.closest('[data-fix]'); if(!a) return;\n  say('将打开企查查登录页，扫码后自动续期 7 天');\n});\ndocument.getElementById('btnCache').addEventListener('click', function(){\n  say('已清理 92 个缓存文件（86 KB），日志保留');\n});\n\n/* ── ③ 存储维护 ── */\ndocument.querySelectorAll('[data-exp]').forEach(function(b){\n  b.addEventListener('click', function(){\n    var t=b.dataset.exp;\n    if(t==='diag') say('诊断包已生成：data/diagnostic/诊断包_2026-10-22_0015.zip（2.4 MB）');\n    if(t==='day')  say('资料包已生成：data/archive/2026-10-21_资料包.zip（1.1 MB）');\n    if(t==='open') say('已打开 data 目录（演示环境不实际弹出）');\n  });\n});\n\n/* ── ④ 清理 ── */\nvar CLEAN=[\n  ['backup/2026-08-30_风险明细.xlsx.bak','backup',4.2,'2026-08-30 06:02'],\n  ['backup/2026-09-02_风险明细.xlsx.bak','backup',3.8,'2026-09-02 06:01'],\n  ['diagnostic/诊断包_2026-09-10.zip','diagnostic',2.6,'2026-09-10 22:14'],\n  ['archive/2026-07-18_资料包.zip','archive/excel',1.4,'2026-07-18 05:44'],\n  ['cache/tmp_ocr_2210.tmp','cache',0.4,'2026-09-19 11:02']\n];\nfunction fmt(n){ return n.toFixed(1)+' MB'; }\nvar cleanBody=document.getElementById('cleanBody'), ckAll=document.getElementById('ckAll'),\n    cleanSumFoot=document.getElementById('cleanSumFoot');\n\nfunction renderClean(){\n  cleanBody.innerHTML=CLEAN.map(function(c,i){\n    return '<tr><td><input type=\"checkbox\" data-i=\"'+i+'\" '+(ckAll.checked?'checked':'')+'><\/td>'\n      + '<td class=\"fn\">'+c[0]+'<\/td><td>'+c[1]+'<\/td><td class=\"n\">'+fmt(c[2])+'<\/td><td class=\"dt\">'+c[3]+'<\/td><\/tr>';\n  }).join('');\n  sumClean();\n}\nfunction sumClean(){\n  var boxes=[].slice.call(cleanBody.querySelectorAll('input[type=checkbox]'));\n  var n=0,mb=0;\n  boxes.forEach(function(b){ if(b.checked){ n++; mb+=CLEAN[+b.dataset.i][2]; } });\n  cleanSumFoot.textContent='已选 '+n+' 个 · '+fmt(mb)+' · 清理后记入日志';\n  document.getElementById('cleanGo').disabled = n===0;\n}\nrenderClean();\n\nckAll.addEventListener('change', function(){ renderClean(); });\ncleanBody.addEventListener('change', function(){ sumClean(); });\n\ndocument.getElementById('btnScan').addEventListener('click', function(){\n  document.getElementById('mClean').classList.add('on');\n});\ndocument.getElementById('cleanClose').addEventListener('click', closeClean);\ndocument.getElementById('cleanCancel').addEventListener('click', closeClean);\nfunction closeClean(){ document.getElementById('mClean').classList.remove('on'); }\n\n/* ── 二次确认 ── */\nvar mConfirm=document.getElementById('mConfirm'),\n    cfTitle=document.getElementById('cfTitle'), cfBody=document.getElementById('cfBody'),\n    cfOk=document.getElementById('cfOk'), cfNote=document.getElementById('cfNote');\nfunction ask(opts){\n  cfTitle.textContent=opts.t; cfBody.innerHTML=opts.b; cfOk.textContent=opts.ok||'确认';\n  cfNote.textContent=opts.note||''; cfOk.className='btn sm '+(opts.danger?'danger':'primary');\n  mConfirm.classList.add('on');\n  cfOk.onclick=function(){ mConfirm.classList.remove('on'); opts.fn&&opts.fn(); };\n}\ndocument.getElementById('cfCancel').addEventListener('click', function(){ mConfirm.classList.remove('on'); });\nmConfirm.addEventListener('click', function(e){ if(e.target===mConfirm) mConfirm.classList.remove('on'); });\n\ndocument.getElementById('cleanGo').addEventListener('click', function(){\n  var n=cleanBody.querySelectorAll('input:checked').length;\n  var mb=0;\n  cleanBody.querySelectorAll('input:checked').forEach(function(b){ mb+=CLEAN[+b.dataset.i][2]; });\n  closeClean();\n  ask({\n    t:'确认清理',\n    b:'将删除 <b>'+n+' 个文件<\/b>（'+fmt(mb)+'）。<br>删除不可恢复，日志与数据目录明细会各记一条清理记录。',\n    ok:'删除', danger:true, note:'清理动作会写入 data/logs 与操作日志',\n    fn:function(){\n      document.getElementById('cleanSum').textContent='已清理，暂无待清理文件';\n      document.getElementById('foldBad').textContent='无临时文件';\n      document.getElementById('foldBar').classList.remove('alarm');\n      say('已清理 '+n+' 个文件，释放 '+fmt(mb));\n    }\n  });\n});\n\n/* ── ⑤ 数据目录 ── */\nvar DIRS=[\n  ['ai_analysis/2026/10/',20,'1.2 MB','2026-10-21 05:41','正常'],\n  ['archive/excel/',12,'3.4 MB','2026-10-21 05:36','正常'],\n  ['2026-10-21.xlsx',1,'86 KB','2026-10-21 05:36','正常'],\n  ['task_logs/',34,'210 KB','2026-10-21 05:37','正常'],\n  ['backup/',8,'2.1 MB','2026-10-21 05:32','正常'],\n  ['browser_data/',1680,'1.4 MB','2026-10-21 05:34','正常'],\n  ['cache/',92,'86 KB','2026-09-19 11:02','3 个临时文件'],\n  ['logs/',6,'42 KB','2026-10-21 05:37','正常'],\n  ['diagnostic/',3,'7.2 MB','2026-09-10 22:14','超 5 MB']\n];\ndocument.getElementById('dirBody').innerHTML=DIRS.map(function(d){\n  var bad=d[4]!=='正常';\n  return '<tr><td class=\"p\">'+d[0]+'<\/td><td class=\"n\">'+d[1].toLocaleString('en-US')+'<\/td>'\n    + '<td class=\"n\">'+d[2]+'<\/td><td>'+d[3]+'<\/td>'\n    + '<td'+(bad?' class=\"bad\"':'')+'>'+d[4]+'<\/td><\/tr>';\n}).join('');\n\nvar dirMore=document.getElementById('dirMore'), dirWrap=document.getElementById('dirWrap');\ndirMore.addEventListener('click', function(e){\n  e.preventDefault();\n  var on=dirWrap.classList.toggle('on');\n  dirMore.setAttribute('aria-expanded', on?'true':'false');\n  dirMore.innerHTML=(on?'收起':'展开')\n    +'<svg width=\"12\" height=\"12\" viewBox=\"0 0 12 12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\"><path d=\"m3 4.6 3 3 3-3\"/><\/svg>';\n});\n\n/* ── 侧栏收起 ── */\n(function(){\n  var app=document.querySelector('.app'), btn=document.getElementById('sideToggle');\n  document.querySelectorAll('.side .item').forEach(function(it){\n    if(!it.title){ var t=(it.textContent||'').trim(); if(t) it.title=t; }\n  });\n  function setCol(on){\n    app.classList.toggle('collapsed', on);\n    var lbl=on?'展开侧栏':'收起侧栏';\n    btn.setAttribute('aria-label', lbl); btn.title=lbl;\n    try{ localStorage.setItem('sideCollapsed', on?'1':'0'); }catch(e){}\n  }\n  btn.addEventListener('click', function(){ setCol(!app.classList.contains('collapsed')); });\n  try{ if(localStorage.getItem('sideCollapsed')==='1') setCol(true); }catch(e){}\n})();\n\ndocument.addEventListener('keydown', function(e){\n  if(e.key==='Escape'){\n    document.getElementById('mClean').classList.remove('on');\n    mConfirm.classList.remove('on');\n  }\n});\n<\/script>\n\n<style>\n/* 动画兜底：部分环境（省电模式 / 低帧率 / 无头渲染）不推进动画时钟，\n   2 秒后强制回到终态，保证图表与折线一定完整可见。 */\n.anim-done .bar,\n.anim-done .line,\n.anim-done .dot{animation:none!important; opacity:1!important; transform:none!important; stroke-dashoffset:0!important}\n<\/style>\n<script>\n(function(){\n  document.addEventListener('click', function(e){\n    var t = e.target, a = null;\n    while(t && t !== document){\n      if(t.getAttribute && t.getAttribute('data-nav')){ a = t; break; }\n      t = t.parentNode;\n    }\n    if(!a) return;\n    e.preventDefault();\n    try{ parent.WB_NAV(a.getAttribute('data-nav')); }catch(err){}\n  });\n  setTimeout(function(){\n    document.documentElement.className += ' anim-done';\n  }, 2000);\n})();\n<\/script>\n\n<\/body>\n<\/html>"}</script>
<script>
(function(){
  /* 手机版入口透传分享码，否则会 403 */
  (function(){
    var ml = document.querySelector('a[href="m.html"]');
    if(ml && location.search) ml.href = 'm.html' + location.search;
  })();
  var DOCS = JSON.parse(document.getElementById('docsJson').textContent);
  var KEYS = ['overview','tasks','detail','ai','config','setting'];
  var TITLES = {overview:'总览', tasks:'取数·任务', detail:'风险明细', ai:'AI 与邮件', config:'配置', setting:'系统设置'};
  var CRUMB_ICO = {
    overview:'<rect x="1.7" y="1.7" width="5" height="5" rx="1.4"/><rect x="9.3" y="1.7" width="5" height="5" rx="1.4"/><rect x="1.7" y="9.3" width="5" height="5" rx="1.4"/><rect x="9.3" y="9.3" width="5" height="5" rx="1.4"/>',
    tasks:'<path d="M8 1.8v7.4M8 9.2 4.9 6.1M8 9.2l3.1-3.1M2.2 11.4v1.6c0 .7.6 1.2 1.2 1.2h9.2c.7 0 1.2-.6 1.2-1.2v-1.6"/>',
    detail:'<path d="M2.4 3.6h8.4M2.4 8h11.2M2.4 12.4h6.6"/><circle cx="13.1" cy="3.6" r="1.2"/>',
    ai:'<rect x="1.8" y="3.2" width="12.4" height="9.6" rx="1.8"/><path d="m2.4 4.4 5.6 3.9 5.6-3.9"/>',
    config:'<path d="M2.5 4.8h11M2.5 8h11M2.5 11.2h11"/><circle cx="6" cy="4.8" r="1.6" fill="#fff"/><circle cx="10.6" cy="8" r="1.6" fill="#fff"/><circle cx="5" cy="11.2" r="1.6" fill="#fff"/>',
    setting:'<circle cx="8" cy="8" r="2.3"/><path d="M8 1.6v1.7M8 12.7v1.7M1.6 8h1.7M12.7 8h1.7M3.5 3.5l1.2 1.2M11.3 11.3l1.2 1.2M12.5 3.5l-1.2 1.2M4.7 11.3l-1.2 1.2"/>'
  };
  var app = document.getElementById('app'),
      navItems = [].slice.call(document.querySelectorAll('.item[data-page]')),
      crumbIco = document.querySelector('#crumb svg'),
      crumbText = document.getElementById('crumbText'),
      loaded = {}, current = null;

  function load(key){
    if(loaded[key]) return;
    var f = document.getElementById('f-' + key);
    if(!f || !DOCS[key]) return;
    loaded[key] = true;
    f.srcdoc = DOCS[key];
  }

  function show(key){
    if(!TITLES[key]) key = 'overview';
    current = key;
    load(key);
    KEYS.forEach(function(k){
      var f = document.getElementById('f-' + k);
      if(f) f.classList.toggle('on', k === key);
    });
    navItems.forEach(function(it){ it.classList.toggle('on', it.dataset.page === key); });
    crumbText.textContent = TITLES[key];
    if(crumbIco) crumbIco.innerHTML = CRUMB_ICO[key];
    try{ localStorage.setItem('wbPage', key); }catch(e){}
    try{ if(history.replaceState) history.replaceState(null, '', '#' + key); }catch(e){}
    document.title = '企业风险监测 · ' + TITLES[key];
  }

  window.WB_NAV = function(key){ show(key); };

  navItems.forEach(function(it){
    it.addEventListener('click', function(){ show(it.dataset.page); });
    it.addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); show(it.dataset.page); }
    });
    it.setAttribute('tabindex', '0');
  });

  /* 侧栏收起 */
  var btn = document.getElementById('sideToggle');
  function setCol(on){
    app.classList.toggle('collapsed', on);
    var lbl = on ? '展开侧栏' : '收起侧栏';
    btn.setAttribute('aria-label', lbl); btn.title = lbl;
    try{ localStorage.setItem('sideCollapsed', on ? '1' : '0'); }catch(e){}
  }
  btn.addEventListener('click', function(){ setCol(!app.classList.contains('collapsed')); });

  /* 全局搜索 -> 风险明细 */
  var gs = document.getElementById('gsearch');
  gs.addEventListener('keydown', function(e){
    if(e.key !== 'Enter') return;
    var v = gs.value.trim();
    if(!v) return;
    show('detail');
    setTimeout(function(){
      try{
        var d = document.getElementById('f-detail').contentDocument;
        var q = d.getElementById('q');
        if(q){
          q.value = v;
          q.dispatchEvent(new Event('input', { bubbles: true }));
          var fl = d.querySelector('.filters');
          if(fl && fl.scrollIntoView) fl.scrollIntoView({ behavior:'smooth', block:'center' });
        }
      }catch(err){}
    }, 260);
  });

  /* 初始页：hash > 上次访问 > 总览；其余页面空闲加载 */
  var init = (location.hash || '').replace('#','');
  if(!TITLES[init]){
    try{ init = localStorage.getItem('wbPage') || 'overview'; }catch(e){ init = 'overview'; }
  }
  show(init);
  setTimeout(function(){
    KEYS.forEach(load);
  }, 400);

  try{ if(localStorage.getItem('sideCollapsed') === '1') setCol(true); }catch(e){}
})();
</script>
</body>
